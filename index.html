<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Biomed Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fa;
      color: #1d2939;
    }

    .header {
      background: #0b5d66;
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 25px 25px;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-bottom: 8px;
      color: #0b5d66;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .service {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 22px 10px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .service:active {
      transform: scale(0.96);
    }

    .service .icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .service h3 {
      font-size: 15px;
      color: #0b5d66;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .services {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🏥</div>

    <h1>SMART BIOMED OFFICE</h1>

    <p>سمارت بايوميد لهندسة الأجهزة الطبية</p>
  </div>

  <div class="container">

    <div class="welcome">
      <h2>مرحباً بك 👋</h2>

      <p>
        خدمات هندسة وصيانة الأجهزة الطبية
        والاستشارات والدعم الفني.
      </p>
    </div>

    <div class="services">

      <button class="service" onclick="maintenance()">
        <div class="icon">🔧</div>
        <h3>طلب صيانة</h3>
      </button>

      <button class="service" onclick="services()">
        <div class="icon">🛠️</div>
        <h3>خدماتنا</h3>
      </button>

      <button class="service" onclick="devices()">
        <div class="icon">🏥</div>
        <h3>الأجهزة الطبية</h3>
      </button>

      <button class="service" onclick="engineers()">
        <div class="icon">👨‍🔧</div>
        <h3>المهندسون</h3>
      </button>

      <button class="service" onclick="orders()">
        <div class="icon">📋</div>
        <h3>طلباتي</h3>
      </button>

      <button class="service" onclick="contact()">
        <div class="icon">📞</div>
        <h3>تواصل معنا</h3>
      </button>

    </div>

  </div>

  <div class="footer">
    Smart Biomed Office © 2026
  </div>

  <script>

    function maintenance() {
      alert("🔧 سيتم فتح نموذج طلب الصيانة");
    }

    function services() {
      alert("🛠️ خدمات Smart Biomed Office");
    }

    function devices() {
      alert("🏥 الأجهزة الطبية");
    }

    function engineers() {
      alert("👨‍🔧 فريق المهندسين");
    }

    function orders() {
      alert("📋 طلباتك");
    }

    function contact() {
      alert("📞 تواصل معنا");
    }

  </script>

</body>
</html>
